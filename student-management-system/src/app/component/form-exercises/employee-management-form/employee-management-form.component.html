<div class="container">
  <h2>Employee Management Form</h2>

  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="form">
    <!-- Employee Name Field -->
    <div class="form-group">
      <label for="employeeName">Employee Name</label>
      <input
        type="text"
        id="employeeName"
        formControlName="employeeName"
        class="form-control"
      />
      <small class="error" *ngIf="employeeForm.get('employeeName')?.invalid && employeeForm.get('employeeName')?.touched">
        Employee name is required
      </small>
    </div>

    <!-- Experience Field -->
    <div class="form-group">
      <label for="experience">Experience (Years)</label>
      <input
        type="number"
        id="experience"
        formControlName="experience"
        class="form-control"
      />
      <small class="error" *ngIf="employeeForm.get('experience')?.invalid && employeeForm.get('experience')?.touched">
        <span *ngIf="employeeForm.get('experience')?.errors?.['required']">Experience is required</span>
        <span *ngIf="employeeForm.get('experience')?.errors?.['min']">Experience cannot be negative</span>
      </small>
    </div>

    <!-- Technologies Checkboxes -->
    <div class="form-group">
      <label>Technologies Known</label>
      <div class="checkbox-group" formArrayName="technologies">
        <div class="checkbox-item" *ngFor="let tech of availableTechnologies; let i = index">
          <input
            type="checkbox"
            [id]="'tech-' + i"
            [formControlName]="i"
            class="checkbox-control"
          />
          <label [for]="'tech-' + i" class="checkbox-label">{{ tech }}</label>
        </div>
      </div>
      <small class="error" *ngIf="employeeForm.errors?.['minTechnologies']">
        Select at least 2 technologies
      </small>
    </div>

    <!-- Submit and Reset Buttons -->
    <div class="button-group">
      <button
        type="submit"
        [disabled]="!employeeForm.valid"
        class="btn btn-submit"
      >
        Submit
      </button>
      <button
        type="button"
        (click)="onReset()"
        class="btn btn-reset"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Success Message -->
  <div class="success-message" *ngIf="submitted && submittedData">
    <h3>Employee Information Submitted</h3>
    <div class="info-section">
      <p><strong>Name:</strong> {{ submittedData.employeeName }}</p>
      <p><strong>Experience:</strong> {{ submittedData.experience }} years</p>
    </div>
    <div class="technologies-section">
      <h4>Selected Technologies</h4>
      <ul class="tech-list">
        <li *ngFor="let tech of submittedData.technologies" class="tech-item">
          {{ tech }}
        </li>
      </ul>
    </div>
  </div>
</div>
