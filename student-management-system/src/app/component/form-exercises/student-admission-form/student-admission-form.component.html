<div class="container">
  <h2>Student Admission Form</h2>

  <form (ngSubmit)="onSubmit()" #admissionForm="ngForm" class="form">
    <!-- Student Name Field -->
    <div class="form-group">
      <label for="name">Student Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="student.name"
        #name="ngModel"
        required
        class="form-control"
      />
      <small class="error" *ngIf="name.invalid && name.touched">
        Student name is required
      </small>
    </div>

    <!-- Age Field -->
    <div class="form-group">
      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        name="age"
        [(ngModel)]="student.age"
        #age="ngModel"
        required
        min="19"
        class="form-control"
      />
      <small class="error" *ngIf="age.invalid && age.touched">
        <span *ngIf="age.errors?.['required']">Age is required</span>
        <span *ngIf="age.errors?.['min']">Age must be greater than 18</span>
      </small>
    </div>

    <!-- Course Dropdown -->
    <div class="form-group">
      <label for="course">Course</label>
      <select
        id="course"
        name="course"
        [(ngModel)]="student.course"
        #course="ngModel"
        required
        class="form-control"
      >
        <option value="">Select a Course</option>
        <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
      </select>
      <small class="error" *ngIf="course.invalid && course.touched">
        Course is required
      </small>
    </div>

    <!-- Gender Radio Buttons -->
    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label>
          <input
            type="radio"
            name="gender"
            value="Male"
            [(ngModel)]="student.gender"
            required
          />
          Male
        </label>
        <label>
          <input
            type="radio"
            name="gender"
            value="Female"
            [(ngModel)]="student.gender"
            required
          />
          Female
        </label>
        <label>
          <input
            type="radio"
            name="gender"
            value="Other"
            [(ngModel)]="student.gender"
            required
          />
          Other
        </label>
      </div>
    </div>

    <!-- Submit and Reset Buttons -->
    <div class="button-group">
      <button
        type="submit"
        [disabled]="!admissionForm.valid"
        class="btn btn-submit"
      >
        Submit
      </button>
      <button
        type="button"
        (click)="onReset()"
        class="btn btn-reset"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Submitted Data Display -->
  <div class="data-card" *ngIf="submitted && submittedData">
    <h3>Submitted Information</h3>
    <div class="card-content">
      <p><strong>Name:</strong> {{ submittedData.name }}</p>
      <p><strong>Age:</strong> {{ submittedData.age }}</p>
      <p><strong>Course:</strong> {{ submittedData.course }}</p>
      <p><strong>Gender:</strong> {{ submittedData.gender }}</p>
    </div>
  </div>
</div>
