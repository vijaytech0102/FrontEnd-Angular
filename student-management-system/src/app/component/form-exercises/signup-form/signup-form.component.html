<div class="container">
  <h2>Signup Form</h2>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="form">
    <!-- Username Field -->
    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        class="form-control"
      />
      <small class="error" *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched">
        Username is required
      </small>
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
      />
      <small class="error" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
        <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required</span>
        <span *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format</span>
      </small>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
      />
      <small class="error" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
        <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</span>
        <span *ngIf="signupForm.get('password')?.errors?.['minlength']">
          Password must be at least 8 characters
        </span>
      </small>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
        class="form-control"
      />
      <small class="error" *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched">
        <span *ngIf="signupForm.get('confirmPassword')?.errors?.['required']">
          Confirm password is required
        </span>
        <span *ngIf="signupForm.errors?.['passwordMismatch']">
          Passwords do not match
        </span>
      </small>
    </div>

    <!-- Submit and Reset Buttons -->
    <div class="button-group">
      <button
        type="submit"
        [disabled]="!signupForm.valid"
        class="btn btn-submit"
      >
        Sign Up
      </button>
      <button
        type="button"
        (click)="onReset()"
        class="btn btn-reset"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Success Message -->
  <div class="success-message" *ngIf="submitted && signupForm.valid">
    <p>Signup successful! Welcome {{ signupForm.get('username')?.value }}</p>
  </div>
</div>
