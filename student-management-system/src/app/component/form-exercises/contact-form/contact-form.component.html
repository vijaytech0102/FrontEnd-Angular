<div class="container">
  <h2>Contact Form</h2>
  
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="form">
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Name</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        [(ngModel)]="contact.name"
        #name="ngModel"
        required 
        class="form-control"
      />
      <small class="error" *ngIf="name.invalid && name.touched">
        Name is required
      </small>
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="contact.email"
        #email="ngModel"
        required 
        email
        class="form-control"
      />
      <small class="error" *ngIf="email.invalid && email.touched">
        <span *ngIf="email.errors?.['required']">Email is required</span>
        <span *ngIf="email.errors?.['email']">Invalid email format</span>
      </small>
    </div>

    <!-- Message Field -->
    <div class="form-group">
      <label for="message">Message</label>
      <textarea 
        id="message" 
        name="message" 
        [(ngModel)]="contact.message"
        #message="ngModel"
        required 
        class="form-control"
        rows="5"
      ></textarea>
      <small class="error" *ngIf="message.invalid && message.touched">
        Message is required
      </small>
    </div>

    <!-- Submit and Reset Buttons -->
    <div class="button-group">
      <button 
        type="submit" 
        [disabled]="!contactForm.valid"
        class="btn btn-submit"
      >
        Submit
      </button>
      <button 
        type="button" 
        (click)="onReset()"
        class="btn btn-reset"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Success Message -->
  <div class="success-message" *ngIf="submitted && contactForm.valid">
    <p>Thank you! Your message has been sent successfully.</p>
  </div>
</div>
